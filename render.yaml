# Render Blueprint: the Django API + a free Postgres database.
# Render dashboard -> New -> Blueprint -> pick this repo -> Apply.
#
# The React frontend is hosted on Vercel (frontend/vercel.json), which proxies
# /api/* here so the browser sees ONE site and the refresh cookie stays
# first-party.

databases:
  - name: digibank-db
    plan: free
    databaseName: digibank
    user: digibank

services:
  - type: web
    name: digibank-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Free instances have no pre-deploy hook, so migrations run at start-up.
    # createsuperuser reads DJANGO_SUPERUSER_* below; it fails harmlessly once the admin exists.
    startCommand: python manage.py migrate --noinput && (python manage.py createsuperuser --noinput || true) && gunicorn digibank.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: digibank-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FIELD_ENCRYPTION_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://digibank-api-80qu.onrender.com,https://digibank-eta.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://digibank-eta.vercel.app
      - key: WEBAUTHN_RP_ID
        value: digibank-eta.vercel.app
      - key: WEBAUTHN_ORIGINS
        value: https://digibank-eta.vercel.app
      - key: OTP_DELIVERY_CHANNEL
        value: email
      # Your Resend API key (same value as EMAIL_HOST_PASSWORD in backend/.env).
      # Render asks for it when you apply the Blueprint; it is never in git.
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Optional: Razorpay keys for real top-ups. Leave blank to keep top-ups off.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Admin account for reviewing KYC at https://digibank-api-80qu.onrender.com/admin
      # (free instances have no shell, so it is created at start-up).
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PHONE
        sync: false
      - key: DJANGO_SUPERUSER_NAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Real-time KYC: Cashfree Verification keys (optional). Without them KYC
      # is decided instantly from offline checks (format + Aadhaar checksum).
      - key: CASHFREE_CLIENT_ID
        sync: false
      - key: CASHFREE_CLIENT_SECRET
        sync: false
      - key: CASHFREE_ENV
        value: sandbox
      - key: KYC_AUTO_APPROVE
        value: "on"
      # Login-code e-mail via Brevo (works for every user; free 300/day).
      # Render's free plan blocks SMTP, so an HTTPS e-mail API is required.
      - key: BREVO_API_KEY
        sync: false
      # The sender address you verified in Brevo, e.g. your Gmail address.
      - key: OTP_FROM_EMAIL
        sync: false
      # FREE login-code e-mail: shared secret for the Gmail relay on Vercel
      # (frontend/api/mail-relay.js). Use the same value in Vercel.
      - key: MAIL_RELAY_SECRET
        sync: false
